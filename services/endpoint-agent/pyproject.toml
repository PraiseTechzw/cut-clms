[project]
name = "cut-clms-endpoint-agent"
version = "0.1.0"
description = "Cross-platform CUT-CLMS endpoint inventory agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.0.0",
    "pydantic>=2.11.0",
]

[project.scripts]
cut-cea = "cut_clms_endpoint_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-psutil>=7.0.0",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
