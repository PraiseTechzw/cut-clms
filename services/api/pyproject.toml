[project]
name = "cut-clms-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PraiseTechzw", email = "Praisesamasunga04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=44.0.0",
    "fastapi>=0.162.0",
    "PyJWT>=2.10.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cut-clms-api = "cut_clms_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
